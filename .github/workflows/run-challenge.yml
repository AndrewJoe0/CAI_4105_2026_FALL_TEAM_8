
name: Run Challenge 1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environment.yml

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pandas numpy scikit-learn \
            matplotlib jupyter nbconvert ipykernel

      - name: Generate notebook
        run: python make_final_notebook.py

      - name: Execute final notebook
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute final_challenge.ipynb \
            --output final_challenge.ipynb \
            --ExecutePreprocessor.timeout=1800

      - name: Verify generated files
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          for name in [
              "final_challenge.ipynb",
              "predictions.csv",
              "model_comparison.csv",
              "final_model_plot.png"
          ]:
              assert Path(name).exists(), f"Missing: {name}"

          df = pd.read_csv("predictions.csv")
          assert list(df.columns) == ["ID", "price"]
          assert len(df) == 2467
          assert df["ID"].is_unique
          assert df["price"].notna().all()
          print("All output checks passed.")
          PY

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            final_challenge.ipynb \
            predictions.csv \
            model_comparison.csv \
            final_model_plot.png

          git diff --cached --quiet || \
            git commit -m "Generate final challenge results"

          git push
